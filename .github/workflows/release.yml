name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to create or update"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        run: git checkout "${{ steps.release_tag.outputs.tag }}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve Maven coordinates
        id: maven_project
        shell: bash
        run: |
          VERSION="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          ARTIFACT_ID="$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)"
          TAG_VERSION="${{ steps.release_tag.outputs.tag }}"
          TAG_VERSION="${TAG_VERSION#v}"
          if [[ "$TAG_VERSION" != "$VERSION" ]]; then
            echo "Release tag ${{ steps.release_tag.outputs.tag }} does not match pom.xml version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"

      - name: Build runtime jar
        run: mvn -B verify

      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p target/release-assets
          cp "target/${{ steps.maven_project.outputs.artifact_id }}-${{ steps.maven_project.outputs.version }}.jar" target/release-assets/
          cp "target/${{ steps.maven_project.outputs.artifact_id }}-${{ steps.maven_project.outputs.version }}-sources.jar" target/release-assets/
          ls -l target/release-assets

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Smoke test runtime jar
        run: java -jar "target/release-assets/${{ steps.maven_project.outputs.artifact_id }}-${{ steps.maven_project.outputs.version }}.jar" --version

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" target/release-assets/*.jar --clobber
          else
            gh release create "$RELEASE_TAG" target/release-assets/*.jar \
              --title "$RELEASE_TAG" \
              --notes "Release asset generated by GitHub Actions."
          fi
